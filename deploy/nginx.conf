server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS in front of us; don't leak the nginx version.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML always revalidates so content edits show up immediately;
    # assets get a short cache since filenames aren't fingerprinted.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

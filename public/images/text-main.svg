<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .title-text {
        font-family: 'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 88px;
        font-weight: 900;
        fill: #000000;
        letter-spacing: 0.08em;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .subtitle-text {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 34px;
        font-weight: 800;
        fill: #000000;
        letter-spacing: 0.24em;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <!-- Brand Wordmark -->
  <text x="450" y="85" class="title-text">NETWORKER</text>

  <!-- Subtitle / Tagline -->
  <text x="450" y="170" class="subtitle-text">BUSINESS CONSULTING</text>
</svg>